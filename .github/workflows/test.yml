name: tests

# The public package has no runtime dependencies. Check its syntax, package
# contract, host-install sandbox, and MCP handshake on every supported platform.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: atlias has no dependencies, which is the point.
      - name: syntax
        shell: bash
        run: for f in lib/*.mjs mcp/*.mjs bin/*.mjs test/*.mjs; do node --check "$f"; done
      - name: suite
        run: npm test
      - name: the command line answers
        shell: bash
        run: |
          node bin/atlias.mjs --version
          node bin/atlias.mjs --help | grep -q "atlias install"
      - name: install into a sandbox home and validate what was written
        run: node test/install-sandbox.mjs
      - name: the mcp server completes a handshake
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            | node mcp/server.mjs | grep -q '"name":"atlias"'
